<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#7417ff"
  >

  <meta
    name="robots"
    content="noindex"
  >

  <title>Download KCB Mobile</title>

  <style>
    :root {
      color-scheme: dark;

      --kcb-blue: #002c4d;
      --kcb-green: #84bd00;

      --purple-deep: #5800ec;
      --purple: #7417ff;
      --purple-light: #a72bf4;

      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;

      overflow-x: hidden;

      color: var(--white);

      background: linear-gradient(
        135deg,
        var(--purple-deep) 0%,
        var(--purple) 50%,
        var(--purple-light) 100%
      );

      font-family:
        Outfit,
        Arial,
        sans-serif;
    }

    main {
      display: grid;

      width: min(100%, 1240px);
      min-height: 100vh;

      margin: 0 auto;

      padding: clamp(
        28px,
        5vw,
        72px
      );

      grid-template-columns:
        minmax(0, 1fr)
        minmax(320px, 0.9fr);

      align-items: center;

      gap: clamp(
        24px,
        5vw,
        72px
      );
    }

    /* =========================
       LEFT CONTENT
    ========================= */

    .content {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 650px;
    }

    .logo-wrap {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      margin-bottom: clamp(
        30px,
        6vh,
        66px
      );

      padding: 10px 14px;

      border-radius: 16px;

      background: #ffffff;

      box-shadow:
        0 14px 34px
        rgba(32, 0, 94, 0.2);
    }

    .logo {
      display: block;

      width: clamp(
        170px,
        18vw,
        225px
      );

      max-width: 100%;

      height: auto;
    }

    .eyebrow {
      margin:
        0
        0
        14px;

      color: #d9ff7d;

      font-size: 0.86rem;

      font-weight: 800;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;

      margin: 0;

      font-size: clamp(
        3.4rem,
        7.8vw,
        6.8rem
      );

      font-weight: 700;

      line-height: 0.92;

      letter-spacing: -0.055em;
    }

    .lead {
      max-width: 520px;

      margin:
        26px
        0
        34px;

      color:
        rgba(
          255,
          255,
          255,
          0.86
        );

      font-size: clamp(
        1rem,
        1.7vw,
        1.22rem
      );

      line-height: 1.6;
    }

    /* =========================
       STORE BUTTONS
    ========================= */

    .store-links {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;
    }

    .store-link {
      display: inline-flex;

      min-height: 58px;

      align-items: center;
      justify-content: center;

      padding:
        0
        22px;

      border:
        2px
        solid
        rgba(
          255,
          255,
          255,
          0.95
        );

      border-radius: 14px;

      color: var(--white);

      font-weight: 800;

      text-decoration: none;

      transition:
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    .store-link.primary {
      border-color: var(--kcb-green);

      background: var(--kcb-green);

      color: #142900;
    }

    .store-link:hover,
    .store-link:focus-visible {
      transform:
        translateY(-3px);

      box-shadow:
        0
        14px
        28px
        rgba(
          35,
          0,
          100,
          0.26
        );
    }

    .store-link:focus-visible {
      outline:
        3px
        solid
        #d9ff7d;

      outline-offset: 4px;
    }

    .note {
      margin:
        20px
        0
        0;

      color:
        rgba(
          255,
          255,
          255,
          0.72
        );

      font-size: 0.86rem;

      line-height: 1.5;
    }

    /* =========================
       PHONE
    ========================= */

    .phone-stage {
      position: relative;

      z-index: 1;

      display: flex;

      width: 100%;

      align-items: center;
      justify-content: center;

      min-width: 0;
    }

    .phone-crop {
      position: relative;

      width: min(
        44vw,
        540px
      );

      max-width: 100%;

      overflow: visible;

      filter:
        drop-shadow(
          0
          28px
          30px
          rgba(
            30,
            0,
            74,
            0.32
          )
        );

      transform:
        rotate(3deg);

      transform-origin: center;
    }

    .phone {
      position: relative;

      display: block;

      width: 100%;

      max-width: 100%;

      height: auto;

      margin: 0 auto;
    }

    /* =========================
       REDIRECT LOADER
    ========================= */

    .redirecting .lead::after {
      display: inline-block;

      width: 0.9em;
      height: 0.9em;

      margin-left: 0.55em;

      border:
        2px
        solid
        rgba(
          255,
          255,
          255,
          0.32
        );

      border-top-color: #d9ff7d;

      border-radius: 50%;

      content: "";

      vertical-align: -0.1em;

      animation:
        spin
        700ms
        linear
        infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (
      max-width: 860px
    ) {
      main {
        min-height: auto;

        padding:
          38px
          28px
          0;

        grid-template-columns: 1fr;

        text-align: center;
      }

      .content {
        margin:
          0
          auto;
      }

      .logo-wrap {
        margin-bottom: 34px;
      }

      .lead {
        margin-right: auto;

        margin-left: auto;
      }

      .store-links {
        justify-content: center;
      }

      .phone-stage {
        margin-top: 24px;
      }

      .phone-crop {
        width: min(
          78vw,
          500px
        );

        transform:
          rotate(2deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (
      max-width: 520px
    ) {
      main {
        padding:
          28px
          18px
          0;
      }

      .logo-wrap {
        margin-bottom: 26px;
      }

      .logo {
        width: 165px;
      }

      .eyebrow {
        font-size: 0.72rem;
      }

      h1 {
        font-size: clamp(
          3rem,
          16vw,
          4.7rem
        );
      }

      .lead {
        margin-top: 22px;

        margin-bottom: 28px;

        font-size: 1rem;
      }

      .store-links {
        display: grid;

        width: 100%;
      }

      .store-link {
        width: 100%;
      }

      .phone-stage {
        margin-top: 28px;
      }

      .phone-crop {
        width: min(
          92vw,
          460px
        );

        transform:
          rotate(0deg);
      }
    }

    @media (
      prefers-reduced-motion: reduce
    ) {
      .store-link,
      .redirecting .lead::after {
        transition: none;

        animation: none;
      }
    }
  </style>

  <script>
    (() => {

      const destinations = {

        android:
          "https://play.google.com/store/apps/details?id=com.kcb.mobilebanking.bi.android",

        ios:
          "https://apps.apple.com/co/app/new-kcb-mobile/id6738310699?l=en-GB"

      };

      const userAgent =
        navigator.userAgent ||
        navigator.vendor ||
        "";

      const isAndroid =
        /android/i.test(
          userAgent
        );

      const isIOS =
        /iPad|iPhone|iPod/i.test(
          userAgent
        ) ||
        (
          navigator.platform ===
          "MacIntel" &&
          navigator.maxTouchPoints > 1
        );

      if (
        isAndroid ||
        isIOS
      ) {

        document
          .documentElement
          .classList
          .add(
            "redirecting"
          );

        window.location.replace(
          isAndroid
            ? destinations.android
            : destinations.ios
        );

      }

    })();
  </script>

</head>

<body>

  <main
    aria-labelledby="page-title"
  >

    <section
      class="content"
    >

      <div
        class="logo-wrap"
      >

        <img
          class="logo"
          src="kcb-mobile-logo.png"
          alt="KCB Mobile App"
        >

      </div>

      <p
        class="eyebrow"
      >
       
      </p>

      <h1
        id="page-title"
      >
        Your bank.<br>
        In your hands.
      </h1>

      <p
        class="lead"
      >
        Download KCB Mobile and bank wherever life takes you.
      </p>

      <div
        class="store-links"
      >

        <a
          class="store-link primary"
          href="https://play.google.com/store/apps/details?id=com.kcb.mobilebanking.bi.android"
          rel="noopener"
        >
          Get it on Google Play
        </a>

        <a
          class="store-link"
          href="https://apps.apple.com/co/app/new-kcb-mobile/id6738310699?l=en-GB"
          rel="noopener"
        >
          Download on the App Store
        </a>

      </div>

      <p
        class="note"
      ></p>

      <noscript>

        <p
          class="note"
        >
          Automatic device detection requires JavaScript.
          Please use one of the download links above.
        </p>

      </noscript>

    </section>

    <div
      class="phone-stage"
      aria-hidden="true"
    >

      <div
        class="phone-crop"
      >

        <img
          class="phone"
          src="phone.png"
          alt=""
        >

      </div>

    </div>

  </main>

</body>
</html>
