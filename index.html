<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#002c4d">
    <meta name="robots" content="noindex">
    <title>Download KCB Mobile</title>
    <style>
      :root {
        color-scheme: light;
        --kcb-blue: #002c4d;
        --kcb-green: #84bd00;
        --surface: #ffffff;
        --muted: #526473;
        --line: #d8e0e5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(132, 189, 0, 0.14), transparent 40%),
          #f5f8fa;
        color: var(--kcb-blue);
        font-family: Outfit, Arial, sans-serif;
      }

      main {
        width: min(100%, 560px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 22px 60px rgba(0, 44, 77, 0.14);
      }

      .accent {
        height: 10px;
        background: linear-gradient(90deg, var(--kcb-green) 0 38%, var(--kcb-blue) 38% 100%);
      }

      .content {
        padding: clamp(32px, 7vw, 56px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #658d1b;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 1.04;
        letter-spacing: -0.04em;
      }

      .lead {
        max-width: 420px;
        margin: 18px auto 30px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .store-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .store-link {
        display: flex;
        min-height: 60px;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--kcb-blue);
        border-radius: 14px;
        color: var(--kcb-blue);
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .store-link.primary {
        border-color: var(--kcb-green);
        background: var(--kcb-green);
        color: #102900;
      }

      .store-link:hover,
      .store-link:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 44, 77, 0.14);
      }

      .store-link:focus-visible {
        outline: 3px solid rgba(0, 102, 94, 0.35);
        outline-offset: 3px;
      }

      .note {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.5;
      }

      .redirecting .lead::after {
        content: "";
        display: inline-block;
        width: 0.9em;
        height: 0.9em;
        margin-left: 0.55em;
        border: 2px solid rgba(0, 44, 77, 0.18);
        border-top-color: var(--kcb-green);
        border-radius: 50%;
        vertical-align: -0.1em;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 480px) {
        .store-links {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .store-link,
        .redirecting .lead::after {
          transition: none;
          animation: none;
        }
      }
    </style>
    <script>
      (() => {
        const destinations = {
          android: "https://play.google.com/store/apps/details?id=com.kcb.mobilebanking.bi.android",
          ios: "https://apps.apple.com/co/app/new-kcb-mobile/id6738310699?l=en-GB"
        };

        const userAgent = navigator.userAgent || navigator.vendor || "";
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/i.test(userAgent)
          || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isAndroid || isIOS) {
          document.documentElement.classList.add("redirecting");
          window.location.replace(isAndroid ? destinations.android : destinations.ios);
        }
      })();
    </script>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <div class="accent" aria-hidden="true"></div>
      <div class="content">
        <p class="eyebrow">KCB Mobile</p>
        <h1 id="page-title">Banking that moves with you.</h1>
        <p class="lead">Choose your device to download the KCB Mobile app.</p>

        <div class="store-links">
          <a class="store-link primary" href="https://play.google.com/store/apps/details?id=com.kcb.mobilebanking.bi.android">Get it on Google Play</a>
          <a class="store-link" href="https://apps.apple.com/co/app/new-kcb-mobile/id6738310699?l=en-GB">Download on the App Store</a>
        </div>

        <p class="note">On a phone or tablet, this page automatically opens the right app store.</p>

        <noscript>
          <p class="note">Automatic device detection requires JavaScript. Please use one of the download links above.</p>
        </noscript>
      </div>
    </main>
  </body>
</html>
